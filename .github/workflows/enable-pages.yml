name: Enable GitHub Pages

on:
  push:
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

jobs:
  enable:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Create Pages site from main /docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/pages-body.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/docs"}}')
          echo "HTTP_STATUS=${code}"
          cat /tmp/pages-body.json
          echo
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            exit 0
          fi
          if [ "$code" = "409" ]; then
            echo "HTTP_STATUS_GET=$(curl -sS -o /tmp/pages-get.json -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
            cat /tmp/pages-get.json
            echo
            exit 0
          fi
          exit 1
